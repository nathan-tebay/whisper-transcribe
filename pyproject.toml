[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "whisper-transcribe"
version = "0.1.0"
requires-python = ">=3.9"
dependencies = ["evdev", "dbus-python"]

[project.scripts]
whisper-transcribe      = "whisper_hotkey.daemon:main"
whisper-transcribe-tray = "whisper_hotkey.tray:main"

[tool.setuptools.packages.find]
where = ["src"]
