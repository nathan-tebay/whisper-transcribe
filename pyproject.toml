[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "whisper-transcribe"
version = "0.1.0"
requires-python = ">=3.9"
dependencies = ["evdev"]

[project.scripts]
whisper-transcribe = "whisper_hotkey.daemon:main"

[tool.setuptools.packages.find]
where = ["src"]
